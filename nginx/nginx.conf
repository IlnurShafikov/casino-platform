worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # Общий лимит для API — 10 запросов/сек на IP, с запасом на всплеск
    # до 20 запросов, обрабатываемых сразу (nodelay), а не в очереди.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # /auth/ — отдельная, более строгая зона: основная цель
    # брутфорса/подбора пароля, поэтому лимит жёстче остального API.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

    upstream auth_service {
        server auth-service:8083;
    }

    upstream wallet_service {
        server wallet-service:8081;
    }

    upstream bet_service {
        server bet-service:8082;
    }

    upstream game_service {
        server game-service:8084;
    }

    server {
        listen 80;

        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /wallets/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://wallet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /bets {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://bet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /games/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://game_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}